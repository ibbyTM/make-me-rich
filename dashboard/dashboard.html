<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAIS — The Register</title>
<style>
  /* Same token system as the landing page (index.html) — kept in sync by
     hand since this is a zero-build, zero-dependency pair of static files. */
  :root {
    --ink:        #1B1F1C;
    --ink-soft:   #4B534C;
    --ink-faint:  #7B8279;
    --paper:      #EDEFEA;
    --paper-raised: #E3E6DE;
    --paper-line: #C7CCC2;
    --accent:       #1F4D3A;
    --accent-bright:#2F6B4F;
    --accent-ink:   #F4F6F2;
    --flag:     #A9761F;
    --flag-bg:  rgba(169,118,31,0.12);
    --flag-line:rgba(169,118,31,0.35);
    --good:     #1F4D3A;
    --good-bg:  rgba(31,77,58,0.10);
    --bad:      #9A3B2E;
    --bad-bg:   rgba(154,59,46,0.10);
    --bad-line: rgba(154,59,46,0.32);
    --slate:    #35526B;
    --slate-bg: rgba(53,82,107,0.10);
    --slate-line: rgba(53,82,107,0.32);
    --shadow: 0 1px 2px rgba(27,31,28,0.06), 0 8px 24px rgba(27,31,28,0.05);

    --font-display: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --font-body: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono: "SF Mono","Cascadia Code","Roboto Mono",Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink:        #E7E9E2;
      --ink-soft:   #ACB3A7;
      --ink-faint:  #6F766C;
      --paper:      #14170F;
      --paper-raised: #1C2016;
      --paper-line: #333A2C;
      --accent:       #5B9A78;
      --accent-bright:#79B896;
      --accent-ink:   #0D110B;
      --flag:     #D9A24B;
      --flag-bg:  rgba(217,162,75,0.14);
      --flag-line:rgba(217,162,75,0.35);
      --good:     #5B9A78;
      --good-bg:  rgba(91,154,120,0.14);
      --bad:      #D9776A;
      --bad-bg:   rgba(217,119,106,0.14);
      --bad-line: rgba(217,119,106,0.35);
      --slate:    #7C9CB8;
      --slate-bg: rgba(124,156,184,0.14);
      --slate-line: rgba(124,156,184,0.35);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --ink: #E7E9E2; --ink-soft: #ACB3A7; --ink-faint: #6F766C;
    --paper: #14170F; --paper-raised: #1C2016; --paper-line: #333A2C;
    --accent: #5B9A78; --accent-bright: #79B896; --accent-ink: #0D110B;
    --flag: #D9A24B; --flag-bg: rgba(217,162,75,0.14); --flag-line: rgba(217,162,75,0.35);
    --good: #5B9A78; --good-bg: rgba(91,154,120,0.14);
    --bad: #D9776A; --bad-bg: rgba(217,119,106,0.14); --bad-line: rgba(217,119,106,0.35);
    --slate: #7C9CB8; --slate-bg: rgba(124,156,184,0.14); --slate-line: rgba(124,156,184,0.35);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
  }
  :root[data-theme="light"] {
    --ink: #1B1F1C; --ink-soft: #4B534C; --ink-faint: #7B8279;
    --paper: #EDEFEA; --paper-raised: #E3E6DE; --paper-line: #C7CCC2;
    --accent: #1F4D3A; --accent-bright: #2F6B4F; --accent-ink: #F4F6F2;
    --flag: #A9761F; --flag-bg: rgba(169,118,31,0.12); --flag-line: rgba(169,118,31,0.35);
    --good: #1F4D3A; --good-bg: rgba(31,77,58,0.10);
    --bad: #9A3B2E; --bad-bg: rgba(154,59,46,0.10); --bad-line: rgba(154,59,46,0.32);
    --slate: #35526B; --slate-bg: rgba(53,82,107,0.10); --slate-line: rgba(53,82,107,0.32);
    --shadow: 0 1px 2px rgba(27,31,28,0.06), 0 8px 24px rgba(27,31,28,0.05);
  }

  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: var(--accent); }
  h1 { font-family: var(--font-display); font-weight: 600; margin: 0 0 2px; font-size: 22px; text-wrap: balance; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }
  @media (max-width: 640px) { .wrap { padding: 0 16px; } }

  header.top { padding: 26px 0 6px; }
  .back { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); text-decoration: none; margin-bottom: 10px; }
  .back:hover { color: var(--accent); }
  .sub { color: var(--ink-faint); font-size: 12.5px; font-family: var(--font-mono); margin-top: 4px; }

  .panel { margin: 14px 0 0; padding: 16px 20px; background: var(--paper-raised); border: 1px solid var(--paper-line); border-radius: 4px; }
  .panel-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; display: block; }

  .runrow { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .runrow .src { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .runrow .last { color: var(--ink-faint); font-size: 11.5px; font-family: var(--font-mono); }

  .status { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 2px; border: 1px solid var(--paper-line); background: var(--paper); }
  .status.queued  { color: var(--ink-faint); }
  .status.running { color: var(--flag); background: var(--flag-bg); border-color: var(--flag-line); }
  .status.done    { color: var(--good); background: var(--good-bg); border-color: var(--good); }
  .status.failed  { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-line); }

  button {
    font: inherit; font-family: var(--font-body); font-weight: 600; font-size: 13.5px;
    padding: 7px 16px; border-radius: 3px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-bright); border-color: var(--accent-bright); }
  button:disabled { background: var(--paper-line); border-color: var(--paper-line); color: var(--ink-faint); cursor: default; }
  button.secondary { background: transparent; color: var(--accent); border-color: var(--paper-line); font-weight: 500; padding: 4px 11px; font-size: 12.5px; }
  button.secondary:hover:not(:disabled) { border-color: var(--accent); background: var(--paper); }

  .controls { display: flex; gap: 14px; align-items: center; padding: 16px 0; flex-wrap: wrap; border-bottom: 1px solid var(--paper-line); margin-top: 10px; }
  .controls .field { display: flex; flex-direction: column; gap: 3px; }
  .controls label { font-size: 11px; font-family: var(--font-mono); letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-faint); }
  select, input[type=number], input[type=search], input[type=text] {
    font: inherit; font-size: 13.5px; padding: 6px 9px; border: 1px solid var(--paper-line);
    border-radius: 3px; background: var(--paper); color: var(--ink);
  }
  select:focus, input:focus { border-color: var(--accent); }
  input[type=number] { width: 96px; }
  input[type=search] { width: 220px; }
  .count { margin-left: auto; color: var(--ink-faint); font-size: 12.5px; font-family: var(--font-mono); }

  /* ---------------------------------------------------------------------
     Property card grid
  --------------------------------------------------------------------- */
  .grid-wrap { padding: 22px 0 48px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(264px, 1fr));
    gap: 18px;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--paper-raised);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    min-width: 0;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .card-media {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--paper);
    overflow: hidden;
    flex-shrink: 0;
  }
  .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-media .placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background:
      repeating-linear-gradient(45deg, var(--paper-line) 0, var(--paper-line) 1px, transparent 1px, transparent 14px);
    color: var(--ink-faint);
  }
  .card-media .placeholder svg { width: 30px; height: 30px; opacity: 0.5; }
  .card-price {
    position: absolute; left: 10px; bottom: 10px;
    font-family: var(--font-mono); font-weight: 600; font-size: 14.5px;
    color: var(--accent-ink); background: var(--accent);
    padding: 4px 9px; border-radius: 2px;
    font-variant-numeric: tabular-nums;
  }
  .card-body { padding: 13px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-address { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .card-meta { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 9px; font-size: 11px;
    border: 1px solid var(--paper-line); background: var(--paper); color: var(--ink-soft); white-space: nowrap;
  }
  .tag.type { color: var(--ink); }
  .tag.citywide { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .tag.educating { background: var(--flag-bg); border-color: var(--flag-line); color: var(--flag); }
  .tag.datacentre { background: var(--slate-bg); border-color: var(--slate-line); color: var(--slate); }
  .tag.fit-strong { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .tag.fit-possible { background: var(--flag-bg); border-color: var(--flag-line); color: var(--flag); }
  .tag.fit-unlikely { color: var(--ink-faint); }
  .tag.va-strong { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .tag.va-possible { background: var(--flag-bg); border-color: var(--flag-line); color: var(--flag); }
  .tag.va-unlikely { color: var(--ink-faint); }
  .tag.ready-ready { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .tag.ready-some_work { background: var(--flag-bg); border-color: var(--flag-line); color: var(--flag); }
  .tag.ready-major_work { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
  .card-power { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); }
  .card-power .approx::after { content: " (approx., city-level)"; color: var(--ink-faint); }
  .card-why { color: var(--ink-faint); font-size: 12px; line-height: 1.45; margin-top: auto; padding-top: 4px; border-top: 1px solid var(--paper-line); }
  .card-foot { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .card-link { color: var(--accent); font-weight: 600; }

  .empty { grid-column: 1 / -1; padding: 56px 20px; text-align: center; color: var(--ink-faint); border: 1px dashed var(--paper-line); border-radius: 4px; }
  .warn { margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--flag-line); background: var(--flag-bg); border-radius: 3px; font-size: 12.5px; color: var(--ink); }

  /* ---------------------------------------------------------------------
     New search + requirements list
  --------------------------------------------------------------------- */
  .newsearch { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .newsearch .field { display: flex; flex-direction: column; gap: 3px; }
  .newsearch .field label { font-size: 11px; font-family: var(--font-mono); letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-faint); }
  .newsearch input.geo { width: 180px; }
  .newsearch input.kw { width: 150px; }
  .newsearch input.num { width: 90px; }
  .reqlist { margin-top: 14px; border-top: 1px solid var(--paper-line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
  .reqrow { display: flex; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; flex-wrap: wrap; }
  .reqrow .rname { font-weight: 600; min-width: 190px; }
  .reqrow .rdetail { color: var(--ink-faint); font-family: var(--font-mono); font-size: 11.5px; flex: 1; min-width: 200px; }
  .discoverNote { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; }
  .discoverNote code { font-family: var(--font-mono); background: var(--paper); padding: 1px 5px; border-radius: 2px; }
  .discoverNote.err { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="back" href="/">← CAIS</a>
  <h1>The Register</h1>
  <div class="sub" id="meta">Reading the register…</div>
</header>

<div id="warnings"></div>

<div class="panel">
  <span class="panel-title">Run scrapers</span>
  <div class="runrow" id="runRow">
    <!-- source checkboxes injected here -->
    <button id="runBtn">Run selected</button>
    <span class="last" id="runNote"></span>
  </div>
</div>

<div class="panel">
  <span class="panel-title">New search</span>
  <div class="newsearch">
    <div class="field"><label for="nsName">Name (optional)</label><input type="text" id="nsName" placeholder="e.g. Bristol Retail Fund"></div>
    <div class="field"><label for="nsGeo">Geography</label><input type="text" class="geo" id="nsGeo" placeholder="e.g. Bristol, Bath"></div>
    <div class="field"><label for="nsKw">Property type / keywords</label><input type="text" class="kw" id="nsKw" placeholder="e.g. retail, industrial"></div>
    <div class="field"><label for="nsBudgetMin">Budget min £</label><input type="number" class="num" id="nsBudgetMin" min="0" step="10000"></div>
    <div class="field"><label for="nsBudgetMax">Budget max £</label><input type="number" class="num" id="nsBudgetMax" min="0" step="10000"></div>
    <div class="field"><label for="nsMinSize">Min size sq ft</label><input type="number" class="num" id="nsMinSize" min="0" step="100"></div>
    <button id="nsSubmit">Create search</button>
  </div>
  <div class="discoverNote" id="nsNote"></div>
  <div class="reqlist" id="reqList"></div>
  <div class="discoverNote" id="discoverResult"></div>
</div>

<div class="controls">
  <div class="field"><label for="fSource">Source</label><select id="fSource"><option value="">All</option></select></div>
  <div class="field"><label for="fType">Type</label><select id="fType"><option value="">All</option></select></div>
  <div class="field"><label for="fReq">Requirement</label><select id="fReq"><option value="">All</option></select></div>
  <div class="field"><label for="fFit">Data Centre Fit</label><select id="fFit"><option value="">All</option><option value="strong">Strong</option><option value="possible">Possible</option><option value="unlikely">Unlikely</option></select></div>
  <div class="field"><label for="fValueAdd">Value-Add Score</label><select id="fValueAdd"><option value="">All</option><option value="strong">Strong</option><option value="possible">Possible</option><option value="unlikely">Unlikely</option></select></div>
  <div class="field"><label for="fReady">School Readiness</label><select id="fReady"><option value="">All</option><option value="ready">Ready</option><option value="some_work">Some work</option><option value="major_work">Major work</option><option value="unknown">Unknown</option></select></div>
  <div class="field"><label for="fShowDupes">&nbsp;</label>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:normal;white-space:nowrap">
      <input type="checkbox" id="fShowDupes"> Show duplicates
    </label>
  </div>
  <div class="field"><label>Price £</label>
    <div style="display:flex;gap:6px;align-items:center">
      <input type="number" id="fPriceMin" placeholder="min" min="0" step="1000">
      <span class="num" style="color:var(--ink-faint)">–</span>
      <input type="number" id="fPriceMax" placeholder="max" min="0" step="1000">
    </div>
  </div>
  <div class="field"><label>Size sq ft</label>
    <div style="display:flex;gap:6px;align-items:center">
      <input type="number" id="fSizeMin" placeholder="min" min="0" step="100">
      <span class="num" style="color:var(--ink-faint)">–</span>
      <input type="number" id="fSizeMax" placeholder="max" min="0" step="100">
    </div>
  </div>
  <div class="field"><label for="fText">Search</label><input type="search" id="fText" placeholder="Address, postcode, agent…"></div>
  <div class="field"><label for="sortField">Sort by</label>
    <div style="display:flex;gap:6px;align-items:center">
      <select id="sortField">
        <option value="priceAmount">Price</option>
        <option value="fitScore">Data Centre Fit</option>
        <option value="valueAddScore">Value-Add Score</option>
        <option value="distanceKm">Distance to substation</option>
      </select>
      <button class="secondary" id="sortBtn" type="button">⇅</button>
    </div>
  </div>
  <span class="count" id="count"></span>
</div>

<div class="grid-wrap">
  <div class="cards" id="cards"></div>
</div>
</div>

<script>
(function () {
  const SOURCES = [
    { key: 'barnsdales', file: 'data/barnsdales.json', label: 'Barnsdales' },
    { key: 'rightmove', file: 'data/rightmove.json', label: 'Rightmove Commercial' },
    { key: 'discovered', file: 'data/discovered.json', label: 'SMC Brownill Vickers' },
  ];
  const datasets = {};
  let all = [];
  let sortDir = 0;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const gbp = n => n > 0 ? '£' + Number(n).toLocaleString('en-GB') : '';

  /** Barnsdales' propertyType is several categories joined by " · "; every
      other source has one clean value. Splitting gives sensible filter
      options either way, and lets a listing match more than one type tag. */
  const typeList = r => String(r.propertyType || '').split('·').map(s => s.trim()).filter(Boolean);

  async function loadDataset(key) {
    const src = SOURCES.find(s => s.key === key);
    try {
      const res = await fetch(src.file + '?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      datasets[key] = await res.json();
    } catch (e) {
      datasets[key] = null;
    }
  }

  function rebuild() {
    all = Object.values(datasets).filter(Boolean).flatMap(d => d.rows || []);
    const meta = Object.values(datasets).filter(Boolean)
      .map(d => d.source + ': ' + (d.rows||[]).length + ' matches, pulled ' + new Date(d.generatedAt).toLocaleString());
    $('meta').textContent = meta.join(' · ') || 'No data files found.';

    const cur = { source: $('fSource').value, requirement: $('fReq').value, type: $('fType').value };
    for (const sel of [$('fSource'), $('fReq'), $('fType')]) while (sel.options.length > 1) sel.remove(1);
    for (const v of [...new Set(all.map(r => r.source))]) $('fSource').add(new Option(v, v));
    for (const v of [...new Set(all.map(r => r.requirement))]) $('fReq').add(new Option(v, v));
    for (const v of [...new Set(all.flatMap(typeList))].sort()) $('fType').add(new Option(v, v));
    for (const [sel, key] of [[$('fSource'),'source'],[$('fReq'),'requirement'],[$('fType'),'type']]) {
      sel.value = [...sel.options].some(o => o.value === cur[key]) ? cur[key] : '';
    }
    renderLastRuns();
    render();
  }

  function cardMedia(r) {
    if (r.imageUrl) {
      return '<img src="' + esc(r.imageUrl) + '" alt="" loading="lazy" onerror="this.parentElement.innerHTML=' +
        '\'<div class=&quot;placeholder&quot;><svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot;><rect x=&quot;3&quot; y=&quot;3&quot; width=&quot;18&quot; height=&quot;18&quot; rx=&quot;1&quot;/><circle cx=&quot;8.5&quot; cy=&quot;9&quot; r=&quot;1.6&quot;/><path d=&quot;M21 15l-5-5-11 11&quot;/></svg></div>\'">';
    }
    return '<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="9" r="1.6"/><path d="M21 15l-5-5-11 11"/></svg></div>';
  }

  function render() {
    const pMin = Number($('fPriceMin').value) || 0;
    const pMax = Number($('fPriceMax').value) || Infinity;
    const sMin = Number($('fSizeMin').value) || 0;
    const sMax = Number($('fSizeMax').value) || Infinity;
    const q = $('fText').value.trim().toLowerCase();
    const typeFilter = $('fType').value;

    const fitFilter = $('fFit').value;
    const valueAddFilter = $('fValueAdd').value;
    const readyFilter = $('fReady').value;
    const showDupes = $('fShowDupes').checked;

    let rows = all.filter(r => {
      if (!showDupes && (r.dedup || {}).isDuplicate) return false;
      if ($('fSource').value && r.source !== $('fSource').value) return false;
      if ($('fReq').value && r.requirement !== $('fReq').value) return false;
      if (typeFilter && !typeList(r).includes(typeFilter)) return false;
      if (fitFilter && (r.dataCentreFit || {}).band !== fitFilter) return false;
      if (valueAddFilter && (r.valueAdd || {}).band !== valueAddFilter) return false;
      if (readyFilter && (r.schoolReadiness || {}).band !== readyFilter) return false;
      if ((pMin > 0 || pMax < Infinity) && !((r.priceAmount || 0) >= pMin && (r.priceAmount || 0) <= pMax && r.priceAmount > 0)) return false;
      if ((sMin > 0 || sMax < Infinity) && !(r.sizeSqft != null && r.sizeSqft >= sMin && r.sizeSqft <= sMax)) return false;
      if (q) {
        const hay = [r.address, r.agent, r.source].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const sortField = $('sortField').value;
    const sortValue = r => {
      if (sortField === 'fitScore') return (r.dataCentreFit || {}).score ?? -1;
      if (sortField === 'valueAddScore') return (r.valueAdd || {}).score ?? -1;
      if (sortField === 'distanceKm') {
        const km = (r.substation || {}).distanceKm;
        return km == null ? Infinity : km; // unknown distance sorts last regardless of direction
      }
      return r.priceAmount || 0;
    };
    if (sortDir !== 0) rows = [...rows].sort((a, b) => sortDir * (sortValue(a) - sortValue(b)));

    const hiddenDupes = showDupes ? 0 : all.filter(r => (r.dedup || {}).isDuplicate).length;
    $('count').textContent = rows.length + ' of ' + all.length + ' matches' + (hiddenDupes ? ' (' + hiddenDupes + ' duplicate listing(s) hidden)' : '');
    $('sortBtn').textContent = sortDir === 0 ? '⇅' : sortDir === 1 ? '↑' : '↓';

    const grid = $('cards');
    if (rows.length === 0) { grid.innerHTML = '<div class="empty">No matches for this filter.</div>'; return; }

    grid.innerHTML = rows.map(r => {
      const reqClass = /residential conversion/i.test(r.requirement) ? 'citywide' : /church.*chapel/i.test(r.requirement) ? 'educating' : /data centre/i.test(r.requirement) ? 'datacentre' : '';
      const size = r.sizeSqft ? Number(r.sizeSqft).toLocaleString('en-GB') + ' sq ft' : (r.sizeLabel || '—');
      const price = gbp(r.priceAmount) || esc(r.priceDisplay || 'POA');
      const types = typeList(r).slice(0, 3);
      const ps = r.powerStation || {};
      const sub = r.substation || {};
      const cap = r.substationCapacity || {};
      const fit = r.dataCentreFit || {};
      const va = r.valueAdd || {};
      // Real MVA capacity (Northern Powergrid open data, Yorkshire/North East only) takes
      // priority over the voltage-only badge when it's available for this listing.
      const powerLine = cap.distanceKm != null
        ? '<div class="card-power"><span title="' + esc(cap.source + ' — ' + cap.siteLevel + ' substation') + '">' +
            cap.distanceKm + 'km to ' + esc(cap.name) + ' (' + cap.firmCapacityMva + ' MVA)' +
          '</span></div>'
        : sub.distanceKm != null
        ? '<div class="card-power"><span' + (ps.geocodePrecision === 'city-centroid' ? ' class="approx"' : '') + '>' +
            sub.distanceKm + 'km to ' + esc(sub.name || 'nearest substation') +
            (sub.voltageKv ? ' (' + sub.voltageKv + 'kV)' : '') +
          '</span></div>'
        : '';
      const ready = r.schoolReadiness || {};
      const fitTag = fit.band ? '<span class="tag fit-' + esc(fit.band) + '" title="' + esc((fit.reasons || []).join('; ')) + '">DC fit: ' + esc(fit.band) + ' (' + esc(fit.score) + ')</span>' : '';
      const valueAddTag = va.band && va.band !== 'insufficient_data' ? '<span class="tag va-' + esc(va.band) + '" title="' + esc((va.reasons || []).join('; ')) + '">Value-Add: ' + esc(va.band) + ' (' + esc(va.score) + ')</span>' : '';
      const readyTag = ready.band && ready.band !== 'unknown' ? '<span class="tag ready-' + esc(ready.band) + '" title="' + esc((ready.reasons || []).join('; ')) + '">School readiness: ' + esc(ready.band.replace('_',' ')) + '</span>' : '';
      const dedup = r.dedup || {};
      const dupeTag = (!dedup.isDuplicate && dedup.duplicateCount > 0)
        ? '<span class="tag" title="' + esc(dedup.reason || '') + '">+' + dedup.duplicateCount + ' other listing' + (dedup.duplicateCount > 1 ? 's' : '') + '</span>'
        : (dedup.isDuplicate ? '<span class="tag" title="' + esc(dedup.reason || '') + '">duplicate</span>' : '');
      const inner =
        '<div class="card-media">' + cardMedia(r) + '<span class="card-price num">' + price + '</span></div>' +
        '<div class="card-body">' +
          '<div class="card-address">' + esc(r.address) + '</div>' +
          '<div class="card-meta"><span>' + esc(size) + '</span>' + (r.agent ? '<span>· ' + esc(r.agent) + '</span>' : '') + '</div>' +
          powerLine +
          '<div class="card-tags">' +
            types.map(t => '<span class="tag type">' + esc(t) + '</span>').join('') +
            '<span class="tag">' + esc(r.source) + '</span>' +
            '<span class="tag ' + reqClass + '">' + esc(r.requirement) + '</span>' +
            fitTag +
            valueAddTag +
            readyTag +
            dupeTag +
          '</div>' +
          '<div class="card-why">' + esc((r.reasons || []).join('; ')) + '</div>' +
          '<div class="card-foot"><span>Score ' + esc(r.score ?? '') + '</span>' + (r.url ? '<span class="card-link">View listing →</span>' : '') + '</div>' +
        '</div>';
      return r.url
        ? '<a class="card" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + inner + '</a>'
        : '<div class="card">' + inner + '</div>';
    }).join('');
  }

  // ---- run panel -----------------------------------------------------------
  const runRow = $('runRow');
  const runBtn = $('runBtn');
  for (const s of SOURCES) {
    const span = document.createElement('span');
    span.className = 'src';
    span.innerHTML = '<input type="checkbox" id="run_' + s.key + '" checked>' +
      '<label for="run_' + s.key + '" style="margin:0;color:inherit;font-size:13px">' + esc(s.label) + '</label>' +
      '<span class="status" id="st_' + s.key + '" hidden></span>' +
      '<span class="last" id="last_' + s.key + '"></span>';
    runRow.insertBefore(span, runBtn);
  }

  function renderLastRuns() {
    for (const s of SOURCES) {
      const d = datasets[s.key];
      $('last_' + s.key).textContent = d ? 'last run ' + new Date(d.generatedAt).toLocaleString() : 'no data yet';
    }
  }

  function setControlsDisabled(disabled) {
    runBtn.disabled = disabled;
    for (const s of SOURCES) $('run_' + s.key).disabled = disabled;
    $('nsSubmit').disabled = disabled;
    document.querySelectorAll('.reqrow button').forEach(b => (b.disabled = disabled));
  }

  function showStatuses(jobs) {
    for (const s of SOURCES) { const el = $('st_' + s.key); if (!jobs.some(j => j.key === s.key)) el.hidden = true; }
    for (const j of jobs) {
      if (j.kind !== 'report') continue;
      const el = $('st_' + j.key);
      if (!el) continue;
      el.hidden = false;
      el.className = 'status ' + j.status;
      el.textContent = j.status + (j.status === 'failed' && j.error ? ' — ' + j.error.slice(0, 80) : '');
      el.title = j.error || '';
    }
  }

  function renderDiscoverResult(job) {
    const el = $('discoverResult');
    if (!job) { el.textContent = ''; el.className = 'discoverNote'; return; }
    if (job.status === 'failed') {
      el.className = 'discoverNote err';
      el.textContent = 'Discovery failed: ' + (job.error || 'unknown error');
      return;
    }
    const r = job.result;
    if (!r) { el.textContent = ''; return; }
    el.className = 'discoverNote';
    const byDecision = {};
    for (const c of r.results || []) {
      const label = c.outcome === 'fetch_failed' ? 'fetch failed' : c.classification + ' → ' + c.decision;
      byDecision[label] = (byDecision[label] || 0) + 1;
    }
    const breakdown = Object.entries(byDecision).map(([k, n]) => n + '× ' + k).join(', ');
    el.innerHTML =
      '<strong>' + esc(r.requirementName) + '</strong> — provider: ' + esc(r.providerKind) +
      ' (' + esc(r.providerNote) + ')<br>' +
      'queries: ' + esc((r.queries || []).join(' · ')) + '<br>' +
      r.candidatesFound + ' candidate(s) found and classified — ' + esc(breakdown || 'none') + '.' +
      ' Every candidate is logged to the Sources Register as <code>pending_review</code> — nothing is auto-activated.' +
      ' Nothing here builds a scraper automatically; that remains a manual follow-up.';
  }

  let seenDone = new Set();
  async function pollStatus() {
    let st;
    try { st = await (await fetch('/run/status')).json(); } catch { return; }
    showStatuses(st.jobs || []);
    for (const j of st.jobs || []) {
      if ((j.status === 'done' || j.status === 'failed') && !seenDone.has(j.key + j.finishedAt)) {
        seenDone.add(j.key + j.finishedAt);
        if (j.kind === 'report' && j.status === 'done') { await loadDataset(j.key); rebuild(); }
        if (j.kind === 'discovery') renderDiscoverResult(j);
      }
    }
    if (st.running) {
      setControlsDisabled(true);
      const active = (st.jobs || []).find(j => j.status === 'running');
      $('runNote').textContent = active ? 'running: ' + active.label + '…' : 'running…';
      setTimeout(pollStatus, 1500);
    } else {
      setControlsDisabled(false);
      if ((st.jobs || []).length) $('runNote').textContent = 'finished';
    }
  }

  runBtn.addEventListener('click', async () => {
    const keys = SOURCES.filter(s => $('run_' + s.key).checked).map(s => s.key);
    if (keys.length === 0) { $('runNote').textContent = 'nothing selected'; return; }
    setControlsDisabled(true);
    seenDone = new Set();
    $('runNote').textContent = 'starting…';
    const res = await fetch('/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sources: keys }) });
    if (!res.ok) { $('runNote').textContent = 'failed to start (' + res.status + ')'; setControlsDisabled(false); return; }
    pollStatus();
  });

  // ---- Requirements Register: New search panel ------------------------------
  async function loadRequirements() {
    try {
      const res = await fetch('/requirements');
      const data = await res.json();
      return data.requirements || [];
    } catch {
      return null;
    }
  }

  function reqDetailLine(r) {
    const parts = [r.geographies.join(', ')];
    if (r.keywords && r.keywords.length) parts.push(r.keywords.join(', '));
    if (r.budgetRange) parts.push('£' + r.budgetRange[0].toLocaleString('en-GB') + '–£' + r.budgetRange[1].toLocaleString('en-GB'));
    if (r.minSize) parts.push(r.minSize.toLocaleString('en-GB') + '+ sq ft');
    return parts.join(' · ');
  }

  async function renderRequirements() {
    const reqs = await loadRequirements();
    const listEl = $('reqList');
    if (!reqs) { listEl.innerHTML = '<div class="discoverNote err">Could not load the Requirements Register.</div>'; return; }
    listEl.innerHTML = reqs.map(r =>
      '<div class="reqrow" data-id="' + esc(r.id) + '">' +
        '<span class="rname">' + esc(r.name) + '</span>' +
        '<span class="rdetail">' + esc(reqDetailLine(r)) + '</span>' +
        '<button class="secondary" data-discover="' + esc(r.id) + '">Run discovery</button>' +
      '</div>'
    ).join('');
    listEl.querySelectorAll('button[data-discover]').forEach(btn => {
      btn.addEventListener('click', () => runDiscovery(btn.getAttribute('data-discover')));
    });
  }

  async function runDiscovery(requirementId) {
    setControlsDisabled(true);
    seenDone = new Set();
    $('discoverResult').textContent = '';
    $('runNote').textContent = 'starting discovery…';
    const res = await fetch('/discover', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ requirementId }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      $('runNote').textContent = 'failed to start (' + (body.error || res.status) + ')';
      setControlsDisabled(false);
      return;
    }
    pollStatus();
  }

  $('nsSubmit').addEventListener('click', async () => {
    const geographies = $('nsGeo').value;
    if (!geographies.trim()) { $('nsNote').textContent = 'geography is required'; $('nsNote').className = 'discoverNote err'; return; }
    $('nsSubmit').disabled = true;
    $('nsNote').className = 'discoverNote';
    $('nsNote').textContent = 'creating…';
    const res = await fetch('/requirements', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        name: $('nsName').value,
        geographies,
        keywords: $('nsKw').value,
        budgetMin: $('nsBudgetMin').value,
        budgetMax: $('nsBudgetMax').value,
        minSize: $('nsMinSize').value,
      }),
    });
    const body = await res.json().catch(() => ({}));
    $('nsSubmit').disabled = false;
    if (!res.ok) {
      $('nsNote').className = 'discoverNote err';
      $('nsNote').textContent = body.error || ('failed (' + res.status + ')');
      return;
    }
    $('nsNote').textContent = 'Created "' + body.requirement.name + '". It will be scored on the next scraper run for any source — or click Run discovery below to find candidate agent sites for it now.';
    for (const id of ['nsName', 'nsGeo', 'nsKw', 'nsBudgetMin', 'nsBudgetMax', 'nsMinSize']) $(id).value = '';
    renderRequirements();
  });

  // ---- filters -------------------------------------------------------------
  for (const id of ['fSource', 'fType', 'fFit', 'fValueAdd', 'fReady', 'fShowDupes', 'sortField']) $(id).addEventListener('change', render);
  for (const id of ['fPriceMin', 'fPriceMax', 'fSizeMin', 'fSizeMax', 'fText']) $(id).addEventListener('input', render);
  $('sortBtn').addEventListener('click', () => { sortDir = sortDir === 1 ? -1 : 1; render(); });

  // Filtering to "Residential Conversion" defaults the sort to Value-Add
  // Score (highest first) — that's the primary ranking signal for this
  // strategy (per user direction 2026-07-22), not price. Only applied the
  // moment the filter changes TO that requirement, so a user who then picks
  // a different sort manually isn't fought on every re-render.
  $('fReq').addEventListener('change', () => {
    if ($('fReq').value === 'Residential Conversion') {
      $('sortField').value = 'valueAddScore';
      sortDir = -1;
    }
    render();
  });

  // ---- init ------------------------------------------------------------
  (async () => {
    await Promise.all(SOURCES.map(s => loadDataset(s.key)));
    const missing = SOURCES.filter(s => !datasets[s.key]);
    const warnEl = $('warnings');
    for (const s of missing) {
      const div = document.createElement('div');
      div.className = 'warn';
      div.textContent = s.file + ' not available — run ' + s.label + ' from the panel above to generate it.';
      warnEl.appendChild(div);
    }
    rebuild();
    renderRequirements();
    pollStatus();
  })();
})();
</script>
</body>
</html>
